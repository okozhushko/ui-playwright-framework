name: Playwright Tests

# Deliberately conservative triggers/scope — see the comments below on why
# this doesn't run the full browser matrix on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 01:00 UTC ≈ 03:00–04:00 Europe/Kyiv depending on DST — an off-hours
    # nightly run, timed so it's unlikely to overlap with anyone actively
    # iterating on the suite during the day (and with other CI traffic that
    # might already have opencart.com's Cloudflare on edge — see the
    # "OpenCart.com suite" section in README.md).
    - cron: '0 1 * * *'
  # Lets anyone trigger a run on demand from the Actions tab, e.g. to
  # re-verify after opencart.com's own rate limiting has cleared, or to spot
  # -check a different project/spec without editing this file.
  workflow_dispatch:
    inputs:
      project:
        description: Playwright project to run
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      spec:
        description: 'Optional: specific spec file/glob (leave empty for the whole suite)'
        type: string
        required: false
      environment:
        description: Which environment to run against (see config/env.ts)
        type: choice
        options: [dev, stage, prod]
        default: prod

# A new push/dispatch on the same branch supersedes any run already in
# flight instead of piling up alongside it — this is exactly what protected
# us from ourselves during development, when a manual dispatch and a push
# briefly ran concurrently and doubled up on requests to opencart.com.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: nothing in this workflow needs to write to the
# repo, comment on PRs, or touch packages — read-only is enough to check out
# code and run tests.
permissions:
  contents: read

jobs:
  # Fast, free-of-network-flakiness checks that gate the (slower, live-site,
  # Cloudflare-exposed) e2e job below. No point spending time installing
  # browsers and hitting opencart.com if these fail.
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # Caches node_modules itself (not just npm's registry cache, which
      # `cache: npm` above already gives us) keyed on package-lock.json —
      # on a hit, `npm ci` is skipped entirely instead of just running
      # faster. Safe here: this project has no native/postinstall-compiled
      # dependencies that could go stale across OS/architecture, just plain
      # JS packages (Playwright's own browser *binaries* are a separate,
      # separately-cached concern below — this is only the npm packages).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Belt-and-braces alongside playwright.config.ts's `forbidOnly` (which
      # only fails at test-run time, after browsers are already installed
      # and the suite has started hitting the live site) — this catches an
      # accidentally committed `test.only`/`describe.only` immediately, for
      # free, before any of that.
      - name: Fail on leftover test.only()/describe.only()
        run: |
          if grep -rEn "\.only\s*\(" tests/; then
            echo "::error::test.only()/describe.only() found above — remove it before merging. It would also fail the e2e job below via playwright.config.ts's forbidOnly, just later and more expensively."
            exit 1
          fi
          echo "No .only() found in tests/."

  e2e:
    name: Playwright (${{ github.event.inputs.project || 'chromium' }})
    needs: quality-gates
    runs-on: ubuntu-latest
    # Generous enough to cover the whole-run retry below (2 attempts × up to
    # 10 minutes each) plus setup/install overhead.
    timeout-minutes: 30

    # Overrides the workflow-level `contents: read` default for this job
    # only — the "Append run to test history & publish dashboard" step below
    # pushes a commit to the `test-history` branch (via the token
    # `actions/checkout` already wires up for git), which needs `write`.
    # Harmless on PR/schedule/dispatch runs where that step doesn't
    # execute; still least-privilege in the sense that it's scoped to the
    # one job that needs it, not added workflow-wide.
    permissions:
      contents: write

    env:
      CI: 'true'
      # Which of DEV/STAGE/PROD to run against (see config/env.ts) — only
      # meaningful on workflow_dispatch, where it's a pickable input; falls
      # back to "prod" on push/PR/schedule, matching the input's own
      # default.
      TEST_ENV: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # Same node_modules cache as the quality-gates job above — this is a
      # separate runner/job, so it needs its own cache step, but the same
      # key means it reuses the exact same cache entry quality-gates just
      # populated (or vice versa, whichever job's cache step runs first).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Playwright's own browser binaries rarely change between runs (only
      # when @playwright/test itself is upgraded), so cache them by lockfile
      # hash instead of re-downloading on every single run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # Only chromium's browser binary by default, and only chromium runs
      # below by default. This suite targets opencart.com, a real production
      # site behind Cloudflare — running its full 3-browser matrix from
      # GitHub's shared runner IP ranges (which Cloudflare's WAF already
      # sees heavy, unrelated CI traffic from) is a real way to trip the
      # site's own rate limiter, as documented in README.md. Use the
      # `workflow_dispatch` "project" input to spot-check firefox/webkit
      # on demand instead of adding them to the default matrix.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ github.event.inputs.project || 'chromium' }}

      # The binary is cached, but system-level OS packages (fonts, codecs,
      # etc. installed by `--with-deps`) live outside `~/.cache/ms-playwright`
      # and aren't restored by actions/cache — still need this on a cache hit.
      - name: Install OS dependencies only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ github.event.inputs.project || 'chromium' }}

      # Wraps the whole `playwright test` invocation (not just Playwright's
      # own per-test `retries`, which only re-run individual failing tests
      # within one invocation) in a second, outer retry. This specifically
      # targets opencart.com's Cloudflare rate limiting, where a short cool
      # -down before a fresh full run has a real chance of succeeding —
      # confirmed live during development that a rate-limited run recovered
      # on a later, independent invocation.
      - name: Run Playwright tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 45
          command: npx playwright test --project=${{ github.event.inputs.project || 'chromium' }} ${{ github.event.inputs.spec }}

      # Quality gate: reads the JSON reporter's per-attempt results (see
      # playwright.config.ts) to flag any test that only passed after
      # Playwright's own internal retry — a warning annotation + job
      # summary, not a hard failure. See the script's own header comment
      # for why it stops short of failing the build here.
      - name: Flag tests that only passed after a retry
        if: always()
        run: node .github/scripts/check-flaky-passes.js reports/results.json

      - name: Write job summary
        if: always()
        run: node .github/scripts/write-job-summary.js reports/results.json

      # Deliberately last among the "read reports/results.json" steps above,
      # and gated to `push` events on `main` only (not PRs, not
      # workflow_dispatch spot-checks, not the nightly schedule) — see
      # publish-test-history.sh's own header comment for the full "why not
      # commit to main / why not every trigger" reasoning. `always()` so a
      # failing run still gets recorded — a dashboard that only shows green
      # runs would hide exactly the trend it exists to surface.
      - name: Append run to test history & publish dashboard
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: .github/scripts/publish-test-history.sh reports/results.json

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          # Suffixed by project so this stays collision-free if
          # firefox/webkit are ever added to a real matrix alongside this.
          name: playwright-html-report-${{ github.event.inputs.project || 'chromium' }}
          path: reports/html
          retention-days: 14

      - name: Upload traces, screenshots & videos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-test-results-${{ github.event.inputs.project || 'chromium' }}
          path: reports/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload JUnit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-junit-${{ github.event.inputs.project || 'chromium' }}
          path: reports/junit
          retention-days: 14
